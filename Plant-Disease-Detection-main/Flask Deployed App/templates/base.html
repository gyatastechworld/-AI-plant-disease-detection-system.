<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block pagetitle %}LeafLens{% endblock pagetitle %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink:#18352b; --muted:#60756c; --forest:#175c43; --mint:#dff3e7; --lime:#c9ee78; --paper:#f7fbf4; --line:#dbe9df; }
        * { box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { margin:0; color:var(--ink); background:var(--paper); font-family:'DM Sans',sans-serif; }
        h1,h2,h3,h4,h5,h6,.brand { font-family:'Space Grotesk',sans-serif; }
        a { color:inherit; }
        .site-nav { background:rgba(247,251,244,.92); border-bottom:1px solid var(--line); backdrop-filter:blur(12px); }
        .brand { color:var(--ink); font-size:1.18rem; font-weight:700; text-decoration:none; display:flex; align-items:center; gap:.65rem; }
        .brand-mark { display:grid; place-items:center; width:34px; height:34px; background:var(--lime); border-radius:10px; color:var(--forest); font-size:1.1rem; }
        .nav-link { color:var(--muted)!important; font-weight:600; font-size:.92rem; }
        .nav-link:hover { color:var(--forest)!important; }
        .btn-primary-custom { background:var(--forest); color:white; border:0; border-radius:10px; padding:.78rem 1.15rem; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:.5rem; transition:transform .2s,background .2s; }
        .btn-primary-custom:hover { background:#0e4632; color:white; transform:translateY(-2px); }
        .btn-secondary-custom { color:var(--forest); border:1px solid #aacbb7; border-radius:10px; padding:.73rem 1.1rem; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
        .btn-secondary-custom:hover { background:var(--mint); color:var(--forest); }
        .page-wrap { min-height:calc(100vh - 160px); }
        .section-label { color:var(--forest); text-transform:uppercase; letter-spacing:.12em; font-size:.75rem; font-weight:700; }
        .soft-card { background:white; border:1px solid var(--line); border-radius:18px; box-shadow:0 14px 40px rgba(24,53,43,.07); }
        .site-footer { background:var(--ink); color:#d8e9df; padding:2.4rem 0; margin-top:4rem; }
        .site-footer a { color:#d8e9df; text-decoration:none; opacity:.82; }
        .site-footer a:hover { opacity:1; color:var(--lime); }
        .reveal { animation:rise .55s ease both; }
        @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
        @media (max-width:767px) { .nav-cta { margin-top:.5rem; } }
    </style>
    {% block head %}{% endblock head %}
</head>
<body>
    <nav class="navbar navbar-expand-lg site-nav sticky-top">
        <div class="container py-2">
            <a class="brand" href="/"><span class="brand-mark">+</span> LeafLens <small class="text-muted fw-normal">AI</small></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/index">Disease Detection</a></li>
                    <li class="nav-item"><a class="nav-link" href="/#how-it-works">How It Works</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">About</a></li>
                    <li class="nav-item nav-cta"><a class="btn-primary-custom ms-lg-2" href="/index">Detect Now <span aria-hidden="true">-&gt;</span></a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="page-wrap">{% block body %}{% endblock body %}</main>
    <footer class="site-footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-3">
            <div><a class="brand text-white" href="/"><span class="brand-mark">+</span> LeafLens</a><p class="mb-0 mt-2 small opacity-75">A simple computer vision project for healthier plants.</p></div>
            <div class="d-flex align-items-center gap-3 small"><a href="/">Home</a><a href="/index">Detect</a><a href="/market">Resources</a><a href="/contact">About</a></div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock scripts %}
</body>
</html>
